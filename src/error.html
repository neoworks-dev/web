<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% · Neoworks</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 64px 24px;
				box-sizing: border-box;
				background: #f5efe4;
				color: #09090b;
				font-family: 'Geist Variable', system-ui, sans-serif;
			}
			.wrap {
				display: flex;
				flex-direction: column;
				align-items: center;
				width: 100%;
				max-width: 460px;
			}
			img {
				position: relative;
				z-index: 1;
				height: 160px;
				margin-bottom: -16px;
			}
			.card {
				position: relative;
				box-sizing: border-box;
				width: 100%;
				padding: 36px 24px 24px;
				rotate: -1deg;
				border-radius: 3px;
				background: #ffffff;
				box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
				text-align: center;
			}
			.eyebrow {
				display: inline-block;
				rotate: -2deg;
				font-family: 'Caveat', 'Segoe Print', cursive;
				font-size: 24px;
				line-height: 1;
				color: #1f5f3f;
			}
			h1 {
				margin: 12px 0 0;
				font-size: 28px;
				line-height: 1.2;
				letter-spacing: -0.01em;
			}
			p {
				margin: 12px 0 0;
				font-size: 15px;
				line-height: 1.6;
				color: #3f3f46;
			}
			.status {
				margin-top: 16px;
				font-family: ui-monospace, monospace;
				font-size: 12px;
				color: #71717a;
			}
			a {
				display: inline-block;
				margin-top: 24px;
				padding: 10px 16px;
				border-radius: 6px;
				background: #1f5f3f;
				color: #ffffff;
				font-size: 14px;
				font-weight: 600;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<div class="wrap">
			<img src="/marmot/sleeping.webp" alt="" draggable="false" />
			<div class="card">
				<span class="eyebrow">dozed off</span>
				<h1>Something went wrong on our side</h1>
				<p>%sveltekit.error.message%</p>
				<p class="status">Error %sveltekit.status%</p>
				<a href="/">Back to the start</a>
			</div>
		</div>
	</body>
</html>
